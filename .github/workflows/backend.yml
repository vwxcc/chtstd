name: Backend checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Import FastAPI application
        env:
          SESSION_SECRET: "ci-test-session-secret-123456"
        run: |
          python - <<'PY'
          import traceback
          try:
              from app.main import app
              print(app.title)
          except Exception:
              traceback.print_exc()
              raise
          PY

      - name: Verify application entrypoint
        env:
          SESSION_SECRET: "ci-test-session-secret-123456"
        run: |
          python - <<'PY'
          import asyncio
          from app.database import init_db
          asyncio.run(init_db())
          print("database ok")
          PY
