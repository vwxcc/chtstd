<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Studio — в стиле Claude</title>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@15.0.2/dist/markdown-it.min.js"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'], ['$', '$']],
    displayMath: [['\\[','\\]'], ['$$','$$']]
  },
  options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#D97757; --accent-ink:#FFFFFF; --accent-soft:#F2DDCF;
  --bg:#F7F4EE; --bg-elev:#FFFFFF; --bg-sunken:#EFEAE1;
  --text:#231F1B; --text-muted:#726A5E; --text-faint:#A79E90;
  --border:#E4DDCF; --border-strong:#D6CCBB;
  --code-bg:#1E1B17; --code-text:#EDE7DC;
  --danger:#BF4238; --success:#3F7A4F; --warn:#B4791F;
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --accent:#E2916B; --accent-ink:#1B1512; --accent-soft:#3A2A20;
    --bg:#18140F; --bg-elev:#211B15; --bg-sunken:#0F0C09;
    --text:#F1EAE0; --text-muted:#AA9F8E; --text-faint:#6E6455;
    --border:#332A20; --border-strong:#443627;
    --code-bg:#0B0906; --code-text:#EAE2D3;
    --danger:#E27266; --success:#6FBF7F; --warn:#E0AA55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --accent:#E2916B; --accent-ink:#1B1512; --accent-soft:#3A2A20;
  --bg:#18140F; --bg-elev:#211B15; --bg-sunken:#0F0C09;
  --text:#F1EAE0; --text-muted:#AA9F8E; --text-faint:#6E6455;
  --border:#332A20; --border-strong:#443627;
  --code-bg:#0B0906; --code-text:#EAE2D3;
  --danger:#E27266; --success:#6FBF7F; --warn:#E0AA55;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow:hidden;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
button{font-family:inherit;}
input,textarea,select{font-family:inherit; color:inherit;}
::selection{background:var(--accent-soft);}
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
a{color:var(--accent);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

.app{ display:flex; height:100vh; height:100dvh; width:100%; }

/* ---------- Sidebar ---------- */
.sidebar{
  width:272px; min-width:272px; background:var(--bg-sunken); border-right:1px solid var(--border);
  display:flex; flex-direction:column; transition:margin-left .18s ease;
  padding-top:env(safe-area-inset-top,0px);
}
.sidebar.collapsed{ margin-left:-272px; }
.sidebar-head{ padding:14px 12px 8px; display:flex; flex-direction:column; gap:10px; }
.sidebar-collapse-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.sidebar-collapse-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-muted);border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}.sidebar-collapse-btn:hover{background:var(--accent-soft);color:var(--text)}.sidebar-reveal-btn{position:fixed;left:10px;top:12px;z-index:170;width:36px;height:36px;border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;align-items:center;justify-content:center;cursor:pointer}.sidebar.collapsed~.sidebar-reveal-btn{display:flex}
.brand{ display:flex; align-items:center; gap:8px; padding:2px 4px 6px; font-weight:700; font-size:15px; letter-spacing:.1px; }
.brand .mark{ width:22px; height:22px; border-radius:7px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent-ink); font-size:13px; }
.newchat-btn{
  display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; border-radius:var(--radius-s);
  border:1px solid var(--border-strong); background:var(--bg-elev); color:var(--text); font-size:13.5px; font-weight:500;
  cursor:pointer; transition:background .12s;
}
.newchat-btn:hover{ background:var(--accent-soft); }
.search-wrap{ position:relative; }
.search-wrap input{
  width:100%; padding:8px 10px 8px 30px; border-radius:var(--radius-s); border:1px solid var(--border);
  background:var(--bg-elev); font-size:13px; color:var(--text);
}
.search-wrap svg{ position:absolute; left:9px; top:9px; opacity:.5; }
.chat-list{ flex:1; overflow-y:auto; padding:6px 8px 8px; }
.chat-group-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:12px 8px 4px; }
.chat-item{
  display:flex; align-items:center; gap:6px; padding:8px 8px; border-radius:var(--radius-s); cursor:pointer;
  font-size:13.5px; color:var(--text); position:relative; margin-bottom:1px;
}
.chat-item:hover{ background:var(--bg-elev); }
.chat-item.active{ background:var(--accent-soft); }
.chat-item .title{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-item input.rename{ flex:1; background:var(--bg-elev); border:1px solid var(--accent); border-radius:6px; padding:2px 6px; font-size:13px; }
.chat-item .row-actions{ display:none; gap:2px; }
.chat-item:hover .row-actions{ display:flex; }
.icon-btn svg{display:block;pointer-events:none}
.message-file-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.message-file{display:inline-flex;align-items:center;gap:8px;max-width:320px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elev);color:var(--text);text-decoration:none;font-size:12px;min-width:0}
.message-file:hover{border-color:var(--accent);background:var(--bg-soft)}
.file-thumb{width:46px;height:46px;min-width:46px;border-radius:7px;object-fit:cover;display:block;background:var(--bg-soft);border:1px solid var(--border);overflow:hidden}
.message-file>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  border:none; background:transparent; color:var(--text-muted); cursor:pointer; width:24px; height:24px;
  border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-btn:hover{ background:var(--border); color:var(--text); }
.sidebar-foot{ padding:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
.plan-pill{
  display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:var(--radius-s);
  background:var(--bg-elev); border:1px solid var(--border); font-size:12.5px;
}
.plan-pill .tag{ font-weight:700; padding:2px 7px; border-radius:100px; font-size:10.5px; letter-spacing:.03em; }
.plan-pill .tag.free{ background:var(--border); color:var(--text-muted); }
.plan-pill .tag.pro{ background:var(--accent); color:var(--accent-ink); }
.upgrade-link{ background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; }

/* ---------- Main column ---------- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
.topbar{
  height:52px; min-height:52px; display:flex; align-items:center; gap:10px; padding:0 12px;
  border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top,0px);
}
.model-select{
  display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:100px; border:1px solid var(--border-strong);
  background:var(--bg-elev); font-size:13px; font-weight:600; cursor:pointer; position:relative;
}
.model-select:hover{ background:var(--bg-sunken); }
.model-select .dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex:0 0 7px; }
.model-select .dot.green,.dropdown .status-dot.green{background:var(--success)}
.model-select .dot.yellow,.dropdown .status-dot.yellow{background:#d6a300}
.model-select .dot.red,.dropdown .status-dot.red{background:var(--danger)}
.dropdown .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.topbar .spacer{ flex:1; }
.topbar-badges{ display:flex; align-items:center; gap:8px; }
.badge{
  font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:100px; letter-spacing:.03em;
}
.badge.free{ background:var(--bg-sunken); color:var(--text-muted); border:1px solid var(--border); }
.badge.pro{ background:var(--accent); color:var(--accent-ink); }
.usage-chip{ font-size:11.5px; color:var(--text-muted); padding:4px 8px; border-radius:100px; background:var(--bg-sunken); border:1px solid var(--border); }

/* dropdown menu */
.dropdown{
  position:absolute; top:calc(100% + 6px); left:0; min-width:250px; background:var(--bg-elev);
  border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:0 12px 32px rgba(0,0,0,.18);
  padding:6px; z-index:50; display:none;
}
.dropdown.open{ display:block; }
.dropdown .opt{
  display:flex; flex-direction:column; gap:1px; padding:8px 10px; border-radius:var(--radius-s); cursor:pointer;
}
.dropdown .opt:hover{ background:var(--bg-sunken); }
.dropdown .opt.selected{ background:var(--accent-soft); }
.dropdown .opt .name{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
.dropdown .opt .desc{ font-size:11.5px; color:var(--text-muted); }
.lockchip{ font-size:9.5px; font-weight:700; background:var(--accent); color:var(--accent-ink); padding:1px 6px; border-radius:100px; }

/* ---------- Messages ---------- */
.thread{ flex:1; overflow-y:auto; padding:20px 0 8px; }
.thread-inner{ max-width:1080px; margin:0 auto; width:100%; padding:0 28px; display:flex; flex-direction:column; gap:24px; }
.thread-inner .msg-body{ max-width:100%; width:100%; }
.msg.assistant .bubble{ max-width:100%; }
.msg.user .msg-body{ max-width:min(78%,820px); }
.empty-state{ max-width:700px; margin:12vh auto 0; text-align:center; padding:0 24px; }
.empty-state .mark{ display:none; }
.empty-state h1{ font-size:22px; margin:0 0 8px; }
.empty-state p{ font-size:13.5px; color:var(--text-muted); line-height:1.6; margin:0 0 20px; }
.suggest-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.suggest-chip{
  border:1px solid var(--border-strong); background:var(--bg-elev); border-radius:100px; padding:8px 14px;
  font-size:12.5px; cursor:pointer; color:var(--text);
}
.suggest-chip:hover{ background:var(--accent-soft); }

.msg{ display:flex; gap:12px; }
.msg.user{ flex-direction:row-reverse; }
.avatar{
  width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700;
}
.avatar.assistant{ background:var(--accent); color:var(--accent-ink); }
.avatar.user{ background:var(--bg-sunken); color:var(--text-muted); border:1px solid var(--border); }
.msg-body{ max-width:78%; display:flex; flex-direction:column; gap:6px; min-width:0; }
.msg.user .msg-body{ align-items:flex-end; }
.bubble{ font-size:14.5px; line-height:1.62; }
.msg.user .bubble{
  background:var(--bg-sunken); border:1px solid var(--border); padding:10px 14px; border-radius:16px 16px 4px 16px;
}
.msg.assistant .bubble{ padding-top:2px; }
.bubble p{ margin:0 0 10px; }
.bubble p:last-child{ margin-bottom:0; }
.bubble ul,.bubble ol{ margin:0 0 10px; padding-left:22px; }
.bubble code{ font-family:var(--mono); background:var(--bg-sunken); padding:1px 5px; border-radius:5px; font-size:.9em; }
.msg.user .bubble code{ background:rgba(0,0,0,.08); }
.attach-chips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
 .attach-chip{cursor:pointer;
  display:flex; align-items:center; gap:6px; font-size:11.5px; background:var(--bg-elev); border:1px solid var(--border);
  padding:5px 9px; border-radius:100px; color:var(--text-muted);
}

/* thinking block */
.thinking{
  border:1px solid var(--border); border-radius:var(--radius-s); background:var(--bg-sunken); overflow:hidden;
}
.thinking-head{
  display:flex; align-items:center; gap:7px; padding:8px 11px; cursor:pointer; font-size:12px; color:var(--text-muted); font-weight:600;
}
.thinking-head svg{ transition:transform .15s; }
.thinking.open .thinking-head svg{ transform:rotate(90deg); }
.thinking-body{ display:none; padding:0 12px 10px; font-size:12.5px; color:var(--text-muted); line-height:1.6; white-space:pre-wrap; }
.thinking.open .thinking-body{ display:block; }
.pulse{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite ease-in-out; }
@keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

/* code block */
.codeblock{ border-radius:var(--radius-s); overflow:hidden; border:1px solid var(--border-strong); margin:0 0 10px; background:var(--code-bg); }
.codeblock .cb-head{
  display:flex; align-items:center; gap:8px; padding:7px 10px; background:rgba(255,255,255,.04);
  font-family:var(--mono); font-size:11.5px; color:var(--code-text); opacity:.85;
}
.codeblock .cb-head .lang{ flex:1; }
.codeblock .cb-head button{
  background:none; border:none; color:var(--code-text); opacity:.8; cursor:pointer; font-size:11px;
  display:flex; align-items:center; gap:4px; padding:3px 6px; border-radius:5px;
}
.codeblock .cb-head button:hover{ background:rgba(255,255,255,.1); opacity:1; }
.codeblock pre{ margin:0; padding:12px 14px; overflow-x:auto; }
.codeblock code{ font-family:var(--mono); font-size:12.5px; color:var(--code-text); line-height:1.55; background:none; padding:0; }
.cb-output{ border-top:1px solid rgba(255,255,255,.1); padding:10px 14px; font-family:var(--mono); font-size:12px; color:var(--success); white-space:pre-wrap; display:none; }
.cb-output.show{ display:block; }
.cb-output.err{ color:var(--danger); }

/* message actions */
.msg-actions{ display:flex; align-items:center; gap:2px; opacity:.55; transition:opacity .12s; }
.msg-actions:hover{ opacity:1; }
.msg-actions button.active{ color:var(--accent); }
.model-tag{
  font-size:10.5px; color:var(--text-faint); font-family:var(--mono); padding:3px 6px; border-radius:5px; cursor:default;
  border:1px solid transparent;
}
.model-tag:hover{ border-color:var(--border); }

.error-bubble{ border:1px solid var(--danger); background:color-mix(in srgb, var(--danger) 10%, transparent); border-radius:var(--radius-s); padding:10px 13px; font-size:13px; color:var(--danger); display:flex; flex-direction:column; gap:8px; }
.retry-btn{ align-self:flex-start; background:var(--danger); color:#fff; border:none; padding:5px 11px; border-radius:7px; font-size:12px; cursor:pointer; font-weight:600; }

.banner{ margin:0 auto 12px; max-width:720px; padding:0 20px; }
.banner-inner{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius-s); padding:11px 14px; font-size:13px; display:flex; gap:10px; align-items:flex-start; }

/* ---------- Composer ---------- */
.composer-wrap{ padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px)); }
.composer{
  max-width:1100px; margin:0 auto; background:var(--bg-elev); border:1px solid var(--border-strong);
  border-radius:var(--radius-l); padding:10px 12px 8px; box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.file-preview-row{ display:flex; flex-wrap:wrap; gap:6px; padding:2px 2px 8px; }
.file-chip{
  display:flex; align-items:center; gap:6px; background:var(--bg-sunken); border:1px solid var(--border);
  padding:5px 8px 5px 10px; border-radius:10px; font-size:12px;
}
.file-chip .meta{ display:flex; flex-direction:column; line-height:1.2; }
.file-chip .meta .fname{ font-weight:600; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-chip .meta .fsize{ color:var(--text-muted); font-size:10.5px; }
.file-chip button{ background:none; border:none; color:var(--text-muted); cursor:pointer; padding:2px; }
.file-chip.processing .meta .fsize::after{ content:" · обработка…"; }
textarea.composer-input{
  width:100%; resize:none; border:none; background:transparent; font-size:14.5px; line-height:1.5; color:var(--text);
  max-height:200px; padding:6px 4px; outline:none;
}
textarea.composer-input::placeholder{ color:var(--text-faint); }
.composer-toolbar{ display:flex; align-items:center; gap:6px; padding-top:2px; }
.tool-toggle{
  display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:100px; border:1px solid var(--border);
  background:transparent; font-size:12px; color:var(--text-muted); cursor:pointer;
}
.tool-toggle.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--text); }
.composer-toolbar .spacer{ flex:1; }
.send-btn{
  width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.send-btn:disabled{ opacity:.35; cursor:default; }
.stop-btn{ background:var(--text); }
.thread-inner{max-width:1180px !important;text-align:left !important;}
.thread-inner .empty-state{text-align:center;}
.msg{width:100%;justify-content:flex-start;}
.msg-body{width:100% !important;max-width:none !important;min-width:0;}
.msg.assistant .msg-body{width:100% !important;max-width:none !important;align-items:flex-start;}
.msg.assistant .bubble{width:100%;max-width:none !important;text-align:left;}
.md-body{width:100%;max-width:none;text-align:left;}
.md-body p,.md-body li,.md-body td,.md-body th,.md-body blockquote{text-align:left;}
.limit-note{ text-align:center; font-size:11px; color:var(--text-faint); padding-top:6px; }
.limit-note button{ background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:0; }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
.modal-overlay.open{ display:flex; }
.modal{ width:100%; max-width:660px; max-height:82vh; background:var(--bg-elev); border-radius:var(--radius-l); border:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.modal-head{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border); }
.modal-head h2{ font-size:16px; margin:0; flex:1; }
.modal-tabs{ display:flex; gap:4px; padding:10px 14px 0; border-bottom:1px solid var(--border); }
.modal-tab{ padding:8px 12px; font-size:12.5px; font-weight:600; color:var(--text-muted); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; }
.modal-tab.active{ color:var(--accent); border-color:var(--accent); }
.modal-body{ padding:16px 18px; overflow-y:auto; flex:1; }
.modal-body h3{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:0 0 10px; }
.field-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); gap:14px; }
.field-row:last-child{ border-bottom:none; }
.field-row .lbl{ font-size:13.5px; }
.field-row .sub{ font-size:11.5px; color:var(--text-muted); }
.seg{ display:flex; border:1px solid var(--border-strong); border-radius:100px; overflow:hidden; }
.seg button{ border:none; background:transparent; padding:6px 12px; font-size:12px; cursor:pointer; color:var(--text-muted); }
.seg button.active{ background:var(--accent); color:var(--accent-ink); }
select.plain, .selectlike{
  border:1px solid var(--border-strong); background:var(--bg-sunken); border-radius:8px; padding:6px 9px; font-size:12.5px; color:var(--text);
}
table.limits{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.limits th{ text-align:left; font-size:11px; text-transform:uppercase; color:var(--text-faint); padding:6px 8px; border-bottom:1px solid var(--border); }
table.limits td{ padding:8px 8px; border-bottom:1px solid var(--border); }
table.limits tr:last-child td{ border-bottom:none; }
.mini-lock{ font-size:9.5px; background:var(--accent); color:var(--accent-ink); padding:1px 6px; border-radius:100px; font-weight:700; margin-left:6px; }
.chain-list{ display:flex; flex-direction:column; gap:6px; }
.chain-item{ display:flex; align-items:center; gap:8px; background:var(--bg-sunken); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12.5px; }
.chain-item .n{ width:18px; height:18px; border-radius:50%; background:var(--border-strong); font-size:10.5px; display:flex; align-items:center; justify-content:center; font-weight:700; }
.chain-item .name{ flex:1; }
.chain-item .updown{ display:flex; gap:2px; }
.plan-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.plan-card{ border:1px solid var(--border-strong); border-radius:var(--radius-m); padding:16px; }
.plan-card.pro{ border-color:var(--accent); background:var(--accent-soft); }
.plan-card h4{ margin:0 0 4px; font-size:14px; }
.plan-card .price{ font-size:22px; font-weight:700; margin-bottom:10px; }
.plan-card .price span{ font-size:12px; font-weight:400; color:var(--text-muted); }
.plan-card ul{ margin:0 0 14px; padding-left:18px; font-size:12.5px; color:var(--text-muted); line-height:1.8; }
.plan-card button{ width:100%; padding:9px; border-radius:9px; border:1px solid var(--border-strong); background:var(--bg-elev); font-size:13px; font-weight:600; cursor:pointer; }
.plan-card.pro button{ background:var(--accent); color:var(--accent-ink); border:none; }
.toggle{ position:relative; width:38px; height:22px; border-radius:100px; background:var(--border-strong); border:none; cursor:pointer; flex-shrink:0; }
.toggle::after{ content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s; }
.toggle.on{ background:var(--accent); }
.toggle.on::after{ left:18px; }
#generationSettingsOverlay .field-row{align-items:center;}
#generationSettingsOverlay input[type=range]{width:190px;accent-color:var(--accent);}
#generationSettingsOverlay select{min-width:110px;}
.notice-box{ font-size:12px; color:var(--text-muted); background:var(--bg-sunken); border:1px solid var(--border); border-radius:8px; padding:10px 12px; line-height:1.6; }

.chat-header{justify-content:center;position:relative}.chat-header-side{width:120px}.chat-title-wrap{position:absolute;left:50%;transform:translateX(-50%);max-width:45%;text-align:center}.chat-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-header-actions{margin-left:auto;display:flex;align-items:center;gap:3px}.model-picker-bottom{position:relative;z-index:60}.composer-toolbar .model-select{min-width:150px;justify-content:center}.modal-body .newchat-btn{min-height:38px;padding:8px 14px}.modal-body .icon-btn{width:34px;height:34px}.modal-body .selectlike,.modal-body select.plain{min-height:38px}.modal-body .field-row{flex-wrap:wrap}.modal-body .field-row>input,.modal-body .field-row>select{flex:1 1 170px;min-width:150px}.modal-body .field-row>button{flex:0 0 auto}.model-picker-bottom .dropdown{top:auto;bottom:calc(100% + 8px);transform-origin:bottom center}.admin-config-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.admin-config-head h3{margin:0 0 5px}.admin-env{width:100%;min-height:430px;resize:vertical;border:1px solid var(--border);border-radius:12px;background:var(--bg-sunken);color:var(--text);padding:14px;font:12px/1.65 JetBrains Mono,monospace;outline:none}.admin-env:focus{border-color:var(--accent)}.admin-env-help{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);font-size:12px;line-height:1.6}.admin-muted{color:var(--text-muted)}.plan-admin-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.plan-grid label{font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:5px}.plan-grid input{width:100%;min-height:36px;border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--bg);color:var(--text)}
/* toasts */
.toasts{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:300; }
.toast{ background:var(--text); color:var(--bg); padding:9px 16px; border-radius:100px; font-size:12.5px; box-shadow:0 8px 24px rgba(0,0,0,.2); }

.hamburger{ display:flex; }
.sidebar-toggle{ flex-shrink:0; }

@media (max-width:820px){
  .sidebar{ position:fixed; z-index:150; height:100%; box-shadow:0 0 30px rgba(0,0,0,.2);}
  .sidebar.collapsed{ margin-left:-272px; }
  .hamburger{ display:flex; }
  .msg-body{ max-width:92%; }
  .thread-inner{ padding:0 14px; }
  .composer{ max-width:none; }
  .plan-cards{ grid-template-columns:1fr; }
}

.code-output{display:none;border-top:1px solid rgba(255,255,255,.12);padding:10px 14px;white-space:pre-wrap;font:12px/1.5 var(--mono);color:var(--success)}.code-output.show{display:block}.code-output.error{color:var(--danger)}
.thinking-live{margin:4px 0 16px;border:1px solid var(--border-strong);border-radius:15px;background:linear-gradient(135deg,var(--bg-sunken),var(--bg-elev));overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07);min-height:58px}.thinking-live.thinking-active{animation:thinkingGlow 1.5s infinite ease-in-out}
.thinking-live .th-head{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:13px;color:var(--text-muted);font-weight:600;cursor:pointer}.thinking-orb{width:11px;height:11px;border-radius:50%;background:var(--accent);animation:thinkPulse 1.45s infinite}.thinking-live .th-body{max-height:240px;overflow:auto;padding:0 12px 11px;white-space:pre-wrap;font:12px/1.55 var(--mono);color:var(--text-muted)}.thinking-live.hidden .th-body{display:none}.thinking-toggle{margin-left:auto;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-muted);border-radius:7px;padding:4px 7px;font-size:10.5px;cursor:pointer}
@keyframes thinkingGlow{0%,100%{transform:translateY(0);box-shadow:0 8px 30px rgba(0,0,0,.06)}50%{transform:translateY(-1px);box-shadow:0 10px 36px rgba(0,0,0,.12)}}@keyframes thinkPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent);transform:scale(.85)}60%{box-shadow:0 0 0 9px transparent;transform:scale(1)}100%{box-shadow:0 0 0 0 transparent;transform:scale(.85)}}
</style>
</head>
<body>

</div>

<div class="app" id="app" style="display:none">

  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-collapse-row"><div class="brand"><span class="mark">CS</span> Chat Studio</div><button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Скрыть панель" aria-label="Скрыть панель"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button></div>

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09c0 .68.39 1.29 1 1.51.6.23 1.29.1 1.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.23.6.84 1 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Настройки

  </aside>

  <button class="sidebar-reveal-btn" id="sidebarRevealBtn" title="Показать панель" aria-label="Показать панель"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="main">
    <div class="topbar chat-header">
      <div class="chat-header-side"></div>
      <div class="chat-title-wrap"><div class="chat-title" id="chatTitle">Новый чат</div></div>
      <div class="chat-header-actions">
        <button class="icon-btn" id="renameChatBtn" title="Переименовать" aria-label="Переименовать"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button>
        <button class="icon-btn" id="shareChatBtn" title="Поделиться" aria-label="Поделиться"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg></button>
        <button class="icon-btn" id="copyChatBtn" title="Копировать" aria-label="Копировать"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg></button>
        <button class="icon-btn" id="settingsGearBtn" title="Настройки">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00-.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09c0-.68-.39-1.29-1-1.51-.6-.23-1.29-.1-1.82.33l-.06.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09c0 .68.39 1.29 1 1.51.6.23 1.29.1 1.82-.33l.06-.06a2 2 0 112.83 2.83l.06.06A1.65 1.65 0 0019.4 9c.23.6.84 1 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <div id="bannerZone"></div>

    <div class="thread" id="thread">
      <div class="thread-inner" id="threadInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="file-preview-row" id="filePreviewRow"></div>
        <textarea class="composer-input" id="composerInput" placeholder="Спросите что‑нибудь…" rows="1"></textarea>
        <div class="composer-toolbar">
          <div class="model-picker-bottom">
            <button class="model-select" id="modelSelectBtn"><span class="dot"></span><span id="modelSelectLabel">Qwen 3.5 35B</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dropdown" id="modelDropdown"></div>

            Файл

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="limit-note" id="limitNote"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="generationSettingsOverlay">
  <div class="modal" style="max-width:520px;">
    <div class="modal-head"><h2>Параметры ответа</h2><button class="icon-btn" id="closeGenerationSettings" type="button">×</button></div>

      <div class="field-row"><div><div class="lbl">Top P</div><div class="sub">Разнообразие выборки</div></div><div style="display:flex;align-items:center;gap:8px"><input id="topPRange" type="range" min="0.05" max="1" step="0.05" value="1"><b id="topPValue">1.00</b></div></div>

<div class="modal-overlay" id="appDialogOverlay"><div class="modal" style="max-width:440px"><div class="modal-head"><h2 id="appDialogTitle">Подтверждение</h2><button class="icon-btn" id="appDialogClose" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-body"><div id="appDialogText" style="font-size:13.5px;line-height:1.6;color:var(--text-muted)"></div><input id="appDialogInput" class="selectlike" style="width:100%;margin-top:14px;display:none"></div><div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)"><button class="newchat-btn" id="appDialogCancel" style="width:auto">Отмена</button><button class="newchat-btn" id="appDialogConfirm" style="width:auto;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">Подтвердить</button></div></div></div>

<script>
const $ = id => document.getElementById(id);
let csrf = "";
let me = null;
let chats = [];
let currentChatId = null;
let pendingFiles = [];
let currentStream = null;
let currentRequestId = null;
let generating = false;
let authRegister = false;
let models = [];
let taskRoutes = [];
let providers = [];
let plans = [];
let routingSets = [];
let selectedModelId = localStorage.getItem("chatstudio_model_id") || "";

async function api(path, options = {}) {
  options.credentials = "same-origin";
  options.headers = options.headers || {};
  if (options.body && !(options.body instanceof FormData)) options.headers["Content-Type"] = "application/json";
  if (!["GET", "HEAD"].includes((options.method || "GET").toUpperCase()) && csrf) options.headers["X-CSRF-Token"] = csrf;
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.detail || `HTTP ${response.status}`);
    error.status = response.status;
    throw error;
  }
  return data;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtBytes(bytes) {
  if (bytes < 1024) return `${bytes} Б`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} КБ`;
  if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1048576).toFixed(1)} МБ`;
  return `${(bytes / 1073741824).toFixed(1)} ГБ`;
}
function toast(message) {
  const zone = $("toasts");
  const item = document.createElement("div");
  item.style.cssText = "background:var(--text);color:var(--bg-elev);padding:9px 12px;border-radius:9px;font-size:12px;margin-top:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)";
  item.textContent = message;
  zone.appendChild(item);
  setTimeout(() => item.remove(), 3500);
}

function setAuthMode(register) {
  authRegister = register;
  $("authTitle").textContent = register ? "Создать аккаунт" : "Войти в Chat Studio";
  $("authHint").textContent = register ? "Создайте аккаунт для приватных чатов." : "Ваши чаты доступны только вам.";
  $("authNameWrap").style.display = register ? "flex" : "none";
  $("authConfirmWrap").style.display = register ? "flex" : "none";
  $("authSubmit").textContent = register ? "Создать аккаунт" : "Войти";
  $("authSwitchText").textContent = register ? "Уже есть аккаунт?" : "Нет аккаунта?";
  $("authSwitch").textContent = register ? "Войти" : "Зарегистрироваться";
  $("authError").style.display = "none";
}
$("authSwitch").onclick = () => setAuthMode(!authRegister);
$("authSubmit").onclick = async () => {

function groupChats(list) {
  const groups = {today:[], yesterday:[], week:[], older:[]};
  const now = Date.now(), day = 86400000;
  list.forEach(chat => {
    const diff = now - new Date(chat.updated_at).getTime();
    if (diff < day) groups.today.push(chat);
    else if (diff < 2 * day) groups.yesterday.push(chat);
    else if (diff < 8 * day) groups.week.push(chat);
    else groups.older.push(chat);
  });
  return groups;
}

function renderSidebar(list = chats) {
  const groups = groupChats(list);
  const labels = [["today","Сегодня"],["yesterday","Вчера"],["week","7 дней"],["older","Ранее"]];
  let html = "";
  labels.forEach(([key,label]) => {
    if (!groups[key].length) return;
    html += `<div class="chat-group-label">${label}</div>`;
    groups[key].forEach(chat => {
      html += `<div class="chat-item ${chat.id===currentChatId?"active":""}" data-id="${esc(chat.id)}">
        <span class="title">${esc(chat.title || "Новый чат")}</span>

          <button class="icon-btn" data-action="delete" title="Удалить">×</button>

function normalizeMath(source){
  const lines=String(source||"").split("\n");
  let inFence=false;
  return lines.map(function(line){
    if(/^\s*```/.test(line)){inFence=!inFence;return line;}
    if(inFence || line.includes("$") || line.includes("\\(") || line.includes("\\[")) return line;
    const t=line.trim();
    if(/^[-+]?\s*(?:\\(?:frac|dfrac|sqrt|sum|int|lim|alpha|beta|gamma|Delta|pi|sin|cos|tan|log)|[A-Za-z]_[A-Za-z0-9]+\b|[A-Za-z]\^\{?\d)/.test(t) && /\\\\|\^|_/.test(t)) return "\\("+t+"\\)";
    return line;
  }).join("\n");
}
function renderMarkdownLite(text){
  const renderer=window.markdownit?window.markdownit({html:false,linkify:true,typographer:false,breaks:false}):null;
  const source=normalizeMath(String(text||""));
  let html=renderer?renderer.render(source):esc(source).replace(/\n/g,"<br>");
  const hasCode=/```[\s\S]*?```/.test(source);
  const hasTable=/(^|\n)\s*\|.+\|\s*(\n|$)/.test(source);
  const hasMath=source.includes("\\(")||source.includes("\\[")||source.includes("$");
  const kind=hasCode?"Код":hasTable?"Таблица":hasMath?"Формула":"";
  return '<div class="md-body">'+(kind?'<div class="content-kind">'+kind+'</div>':"")+html+'</div>';
}

}

async function sendMessage() {
  if (generating) return stopGeneration();
  const content = $("composerInput").value.trim();
  if (!content && !pendingFiles.length) return;
  if (!currentChatId) await newChat();
  try {
    generating = true; setSendState(true);
    const response = await api(`/api/messages?chat_id=${encodeURIComponent(currentChatId)}`, {
      method:"POST",
      body:JSON.stringify({
        content,
        file_ids:pendingFiles.map(file => file.id),
        model_id:selectedModelId || null,
        temperature:generationSettings.temperature,
        top_p:generationSettings.topP
      })
    });
    $("composerInput").value=""; autoGrow(); pendingFiles=[]; renderFilePreview();
    renderThread(await api(`/api/messages?chat_id=${encodeURIComponent(currentChatId)}`));
    ensureThinkingBlock();
    currentRequestId = response.ai_request.id;
    await streamRequest(currentRequestId);
  } catch (e) {
    toast(e.message); generating=false; setSendState(false);
  }
}

function updateLastAssistant(content, replace=false) {
  let assistant = $("threadInner").querySelector(".msg.assistant:last-child");
  if (!assistant) {
    assistant = document.createElement("article"); assistant.className="msg assistant";
    assistant.innerHTML='<div class="avatar assistant">AI</div><div class="msg-body"><div class="bubble"></div></div>';
    $("threadInner").appendChild(assistant);
  }
  const bubble = assistant.querySelector(".bubble");
  if (replace) bubble.innerHTML = renderMarkdownLite(content || "");
  else {
    const thinking=$("threadInner").querySelector(".thinking-live"); if(thinking){thinking.classList.remove("thinking-active");thinking.classList.add("hidden");}
    const old = assistant.dataset.raw || "";
    const next = old + (content || "");
    assistant.dataset.raw = next;
    bubble.innerHTML = renderMarkdownLite(next);
  }
  enhanceCodeBlocks();
  typesetMath();
  scrollBottom();
}

function ensureThinkingBlock(){
  let box=$("threadInner").querySelector(".thinking-live");
  if(!box){
    box=document.createElement("div");box.className="thinking-live thinking-active";
    box.innerHTML='<div class="th-head"><span class="thinking-orb"></span><span>Размышление</span><button class="thinking-toggle" type="button">Скрыть</button></div><div class="th-body"></div>';
    $("threadInner").appendChild(box);
    box.querySelector(".thinking-toggle").onclick=function(e){e.stopPropagation();box.classList.toggle("hidden");e.currentTarget.textContent=box.classList.contains("hidden")?"Показать":"Скрыть";};
    box.querySelector(".th-head").onclick=function(){box.classList.toggle("hidden");};
  }
  return box;
}
function appendThinking(text){const box=ensureThinkingBlock();const body=box.querySelector(".th-body");body.textContent+=(text||"");body.scrollTop=body.scrollHeight;scrollBottom();}
function streamRequest(requestId){
  return new Promise(function(resolve){
    if(currentStream)currentStream.close();
    currentStream=new EventSource("/api/requests/"+requestId+"/stream");
    currentStream.addEventListener("thinking",function(event){appendThinking(JSON.parse(event.data).text||"");});
    currentStream.addEventListener("delta",function(event){updateLastAssistant(JSON.parse(event.data).text||"");});
    currentStream.addEventListener("replace",function(event){const text=JSON.parse(event.data).text||"";const a=$("threadInner").querySelector(".msg.assistant:last-child");if(a)a.dataset.raw=text;updateLastAssistant("",true);});
    const finish=async function(){
      if(currentStream){currentStream.close();currentStream=null;}
      generating=false;currentRequestId=null;setSendState(false);
      try{renderThread(await api("/api/messages?chat_id="+encodeURIComponent(currentChatId)));await refreshCurrentChat();}catch(e){}
      resolve();
    };
    ["completed","failed","cancelled","done","error"].forEach(function(type){currentStream.addEventListener(type,finish);});
    currentStream.onerror=function(){if(!currentStream||currentStream.readyState===EventSource.CLOSED)finish();};
  });
}

}

/* Settings: backend-aware admin diagnostics while keeping the reference UI. */
let modalTab = "general";
function openSettings(tab="general") { modalTab=tab; $("settingsOverlay").classList.add("open"); document.querySelectorAll(".modal-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab)); renderModalBody(); }
function closeSettings() { $("settingsOverlay").classList.remove("open"); }
$("openSettingsBtn").onclick = () => openSettings();
$("settingsGearBtn").onclick = () => openSettings();
$("renameChatBtn").onclick = async () => {
  const chat=chats.find(c=>c.id===currentChatId); if(!chat)return;
  const title=await showAppDialog("Переименовать чат","Введите новое название.",{input:true,value:chat.title,confirmText:"Сохранить"});
  if(!title||title.trim()===chat.title)return;
  try{const updated=await api(`/api/chats/${currentChatId}`,{method:"PATCH",body:JSON.stringify({title:title.trim()})});Object.assign(chat,updated);updateHeader();renderSidebar();}catch(e){toast(e.message);}
};
$("shareChatBtn").onclick = shareChat;
$("copyChatBtn").onclick = async () => {
  const chat=chats.find(c=>c.id===currentChatId); if(!chat)return;
  try{await navigator.clipboard.writeText(chat.title+"\n\n"+location.href);toast("Скопировано");}catch(e){toast(e.message);}
};
$("closeSettingsBtn").onclick = closeSettings;
document.querySelectorAll(".modal-tab").forEach(button => button.onclick=()=>openSettings(button.dataset.tab));
$("settingsOverlay").addEventListener("click", event => { if(event.target === $("settingsOverlay")) closeSettings(); });
$("upgradeLinkSidebar").onclick = () => toast("Тарифная система пока не подключена.");

function renderModalBody() {
  const body = $("modalBody");
  if (modalTab === "general") {
    body.innerHTML = '<h3>Общие</h3><div class="field-row"><div><div class="lbl">Аккаунт</div><div class="sub">'+esc(me?.name||"")+' · '+esc(me?.email||"")+'</div></div><button class="newchat-btn" style="width:auto" onclick="logout()">Выйти</button></div>';
    return;
  }
  if (modalTab === "limits") {
    if (!me?.is_admin) { body.innerHTML='<p class="admin-muted">Только администратор.</p>'; return; }
    body.innerHTML = '<div class="admin-config-head"><div><h3>Модели</h3><div class="sub">Пользователь выбирает одну модель. Она используется для основного ответа, заголовка и продолжения диалога.</div></div><button class="newchat-btn" id="saveRuntimeEnv">Применить</button></div>'+
      '<textarea id="runtimeEnv" class="admin-env" spellcheck="false" placeholder="MODEL_1_NAME=Модель 1\nMODEL_1_ID=...\nMODEL_1_BASE=https://example/v1\nMODEL_1_KEY=...\nMODEL_1_FILE_INFO=...\n\nMODEL_2_NAME=Модель 2\nMODEL_2_ID=...\nMODEL_2_BASE=https://example/v1\nMODEL_2_KEY=...\nMODEL_2_FILE_INFO=..."></textarea>'+
      '<div class="admin-env-help"><b>Модели</b><br>Каждая <code>MODEL_N</code> — отдельная модель, которую пользователь увидит в списке. Укажи NAME, ID, BASE, KEY и при необходимости FILE_INFO.<br><br><b>Логика</b><br>Выбранная модель используется для всех трёх действий: основной ответ → автоматический заголовок → через 30 секунд 3 предложения для продолжения диалога.<br><br><b>Статус</b><br>Последние 10 обращений: зелёная точка — 100% успешно; жёлтая — 90%; красная — ниже 90%.</div>';
    api("/api/routing/runtime-env").then(x=>{$("runtimeEnv").value=x.content||"";}).catch(e=>toast(e.message));
    setTimeout(()=>{$("saveRuntimeEnv").onclick=async()=>{try{await api("/api/routing/runtime-env",{method:"POST",body:JSON.stringify({content:$("runtimeEnv").value})});await loadRoutingInfo();renderAll();toast("Конфигурация применена");}catch(e){toast(e.message)}}},0);
    return;
  }
  if (modalTab === "plan") {
    if (!me?.is_admin) { body.innerHTML='<p class="admin-muted">Только администратор.</p>'; return; }
    body.innerHTML = plans.map(plan => '<div class="plan-admin-card"><div><b>'+esc(plan.display_name)+'</b><div class="sub">'+esc(plan.name)+'</div></div><div class="plan-grid">'+
      '<label>Запросов/сутки<input data-plan-field="'+plan.name+':requests_per_day" type="number" value="'+plan.requests_per_day+'"></label>'+
      '<label>Токенов<input data-plan-field="'+plan.name+':max_tokens" type="number" value="'+plan.max_tokens+'"></label>'+
      '<label>Файлов<input data-plan-field="'+plan.name+':max_files_per_request" type="number" value="'+plan.max_files_per_request+'"></label>'+
      '<label>Размер, МБ<input data-plan-field="'+plan.name+':max_total_file_size" type="number" value="'+Math.round(plan.max_total_file_size/1048576)+'"></label></div>'+
      '<button class="newchat-btn" data-save-plan="'+plan.name+'">Сохранить</button></div>').join("");
    bindAdminControls();
    return;
  }
}
function bindAdminControls(){
  const addProvider=$("addProviderBtn");
  if(addProvider) addProvider.onclick=async()=>{try{await api("/api/routing/providers",{method:"POST",body:JSON.stringify({name:$("newProviderName").value,base_url:$("newProviderUrl").value,api_key_env:$("newProviderKey").value,enabled:true})});await loadRoutingInfo();renderModalBody();toast("Провайдер добавлен");}catch(e){toast(e.message)}};
  const addModel=$("addModelBtn");
  if(addModel) addModel.onclick=async()=>{try{await api("/api/routing/models",{method:"POST",body:JSON.stringify({provider_id:$("newModelProvider").value,display_name:$("newModelDisplay").value,model_name:$("newModelName").value,max_tokens:Number($("newModelTokens").value||120000),temperature:.2,timeout:300,enabled:true})});await loadRoutingInfo();renderModalBody();toast("Модель добавлена");}catch(e){toast(e.message)}};
  const addRouting=$("addRoutingBtn");
  if(addRouting) addRouting.onclick=async()=>{try{await api("/api/routing/routing-sets",{method:"POST",body:JSON.stringify({name:$("newRoutingName").value})});await loadRoutingInfo();renderModalBody();toast("Routing set добавлен");}catch(e){toast(e.message)}};
  document.querySelectorAll("[data-save-route]").forEach(btn=>btn.onclick=async()=>{const task=btn.dataset.saveRoute;const select=document.querySelector('[data-route-task="'+task+'"]');try{await api("/api/routing/task-routes/"+encodeURIComponent(task),{method:"PUT",body:JSON.stringify({routing_set_id:select.value||null,enabled:!!select.value})});await loadRoutingInfo();renderModalBody();toast("Маршрут сохранён");}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-save-plan]").forEach(btn=>btn.onclick=async()=>{const name=btn.dataset.savePlan;const get=k=>Number(document.querySelector('[data-plan-field="'+name+":"+k+'"]').value);try{await api("/api/routing/plans/"+name,{method:"PATCH",body:JSON.stringify({requests_per_day:get("requests_per_day"),max_tokens:get("max_tokens"),max_files_per_request:get("max_files_per_request"),max_total_file_size:get("max_total_file_size")})});await loadRoutingInfo();renderModalBody();toast("Тариф сохранён");}catch(e){toast(e.message)}});
}
function setTheme(theme) { document.documentElement.dataset.theme=theme; localStorage.setItem("chatstudio_theme",theme); }
const savedTheme=localStorage.getItem("chatstudio_theme"); if(savedTheme) document.documentElement.dataset.theme=savedTheme;

async function shareChat() {
  if (!currentChatId) return;
  try {
    const share = await api(`/api/chats/${currentChatId}/share`, {method:"POST"});
    const url = `${location.origin}${share.url_path}`;
    await navigator.clipboard.writeText(url);
    toast("Ссылка на чат скопирована");
  } catch(e) { toast(e.message); }
}

/* Replace the settings/share affordance behavior without changing the reference visual system. */
function toggleSidebar(collapsed){$("sidebar").classList.toggle("collapsed",collapsed);}
$("sidebarCollapseBtn").onclick=()=>toggleSidebar(true);
$("sidebarRevealBtn").onclick=()=>toggleSidebar(false);

renderFilePreview();
init();

</script>
</body></html>
