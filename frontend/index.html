<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Studio</title>
<style>
:root{--bg:#f7f6f2;--panel:#efeee9;--card:#fff;--text:#262522;--muted:#77756e;--line:#ddd9d0;--accent:#d97757;--accent2:#c76545;--user:#ece9e1;--shadow:0 12px 40px rgba(40,36,28,.08)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.hidden{display:none!important}
.shell{height:100%;display:flex}.sidebar{width:280px;background:#f0eee8;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px}.brand{display:flex;align-items:center;gap:10px;padding:8px 7px 15px;font-weight:700}.logo{width:30px;height:30px;border-radius:9px;background:#25231f;color:#fff;display:grid;place-items:center;font-size:14px}.new{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;text-align:left;font-weight:600}.search{position:relative}.search input{width:100%;border:1px solid var(--line);background:#faf9f6;border-radius:10px;padding:10px 12px;outline:none}.chatlist{overflow:auto;flex:1}.chat{padding:10px 11px;border-radius:9px;margin:3px 0;display:flex;align-items:center;gap:8px}.chat:hover,.chat.active{background:#e5e2da}.chat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;background:#d8d4ca;display:grid;place-items:center;font-size:13px;font-weight:700}.account .info{min-width:0;flex:1}.account .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account .email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(247,246,242,.92)}.title{font-weight:650}.actions{display:flex;gap:7px}.iconbtn{width:36px;height:36px;border-radius:9px}.iconbtn:hover{background:#e9e6de}.thread{flex:1;overflow:auto}.empty{height:100%;display:grid;place-items:center;padding:30px}.welcome{text-align:center;max-width:650px}.welcome h1{font-size:36px;letter-spacing:-1px;margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.6}.messages{max-width:850px;margin:0 auto;padding:35px 24px 170px}.msg{margin:0 0 28px}.msg.user{display:flex;justify-content:flex-end}.bubble{max-width:78%;border-radius:16px;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user)}.assistant .bubble{max-width:100%;padding:0;background:transparent}.meta{font-size:11px;color:var(--muted);margin:0 0 7px 4px}.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.filechip{font-size:12px;padding:5px 9px;background:#ebe8e0;border:1px solid var(--line);border-radius:8px}.composer-wrap{position:fixed;left:280px;right:0;bottom:0;padding:18px 24px 22px;background:linear-gradient(transparent,var(--bg) 28%)}.composer{max-width:850px;margin:auto;background:#fff;border:1px solid #d5d1c8;border-radius:18px;box-shadow:var(--shadow);padding:9px}.composer textarea{display:block;width:100%;min-height:55px;max-height:220px;resize:none;border:0;outline:0;padding:10px 11px;background:transparent}.composebar{display:flex;align-items:center;justify-content:space-between;padding:3px 4px}.lefttools{display:flex;align-items:center;gap:7px}.attach{font-size:22px;width:36px;height:36px;border-radius:9px}.send{width:36px;height:36px;border-radius:10px;background:#25231f;color:white}.send:disabled{opacity:.35}.pending{font-size:12px;color:var(--muted);padding-left:7px}.auth{position:fixed;inset:0;background:rgba(30,28,24,.42);display:grid;place-items:center;z-index:20}.authcard{width:min(410px,calc(100% - 30px));background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.authcard h2{margin:0 0 6px}.authcard p{color:var(--muted);margin:0 0 20px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none}.primary{width:100%;background:#25231f;color:#fff;padding:11px;border-radius:10px;margin-top:8px}.switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}.switch button{color:var(--accent2);font-weight:600}.error{color:#b5422d;font-size:13px;margin:8px 0}.modal{position:fixed;inset:0;background:rgba(25,23,20,.35);z-index:10;display:grid;place-items:center;padding:20px}.modalcard{width:min(700px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h3{margin:0}.fileinput{display:none}@media(max-width:760px){.sidebar{width:70px;padding:10px}.brand span,.new span,.account .info,.search input,.chat span{display:none}.new{text-align:center}.composer-wrap{left:70px}.messages{padding-left:14px;padding-right:14px}.bubble{max-width:90%}.top{padding:0 12px}.welcome h1{font-size:29px}}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="authcard">
    <h2 id="authTitle">Войти в Chat Studio</h2><p id="authHint">Ваши чаты доступны только вам.</p>
    <div id="nameField" class="field hidden"><label>Имя</label><input id="name" autocomplete="name"></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
    <div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"></div>
    <div id="confirmField" class="field hidden"><label>Повторите пароль</label><input id="confirm" type="password"></div>
    <div id="authError" class="error hidden"></div>
    <button id="authSubmit" class="primary">Войти</button>
    <div class="switch"><span id="switchText">Нет аккаунта?</span> <button id="switchMode">Зарегистрироваться</button></div>
  </div>
</div>

<div id="shareModal" class="modal hidden">
 <div class="modalcard"><div class="modalhead"><h3>Ссылка на чат</h3><button class="iconbtn" onclick="closeShare()">✕</button></div>
 <p style="color:var(--muted)">Чат доступен по ссылке в режиме просмотра.</p><input id="shareUrl" readonly style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px"><button class="primary" onclick="copyShare()">Скопировать</button></div>
</div>

<div id="app" class="shell hidden">
 <aside class="sidebar">
  <div class="brand"><div class="logo">CS</div><span>Chat Studio</span></div>
  <button class="new" onclick="newChat()">＋ <span>Новый чат</span></button>
  <div class="search"><input id="search" placeholder="Поиск по чатам"></div>
  <div id="chatList" class="chatlist"></div>
  <div class="account"><div id="avatar" class="avatar">?</div><div class="info"><div id="userName" class="name">—</div><div id="userEmail" class="email">—</div></div><button class="iconbtn" title="Выйти" onclick="logout()">↪</button></div>
 </aside>
 <main class="main">
  <header class="top"><div id="chatTitle" class="title">Новый чат</div><div class="actions"><button class="iconbtn" title="Поделиться" onclick="shareChat()">↗</button><button class="iconbtn" title="Удалить" onclick="deleteChat()">⌫</button></div></header>
  <section id="thread" class="thread"><div class="empty"><div class="welcome"><h1>Чем займёмся?</h1><p>Задайте вопрос, приложите файлы и получите ответ от подключённой модели.</p></div></div></section>
  <div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="Напишите сообщение…" rows="1"></textarea><div id="attachments" class="files"></div><div class="composebar"><div class="lefttools"><button class="attach" title="Прикрепить файл" onclick="fileInput.click()">＋</button><input id="fileInput" class="fileinput" type="file" multiple><span id="pending" class="pending"></span></div><button id="send" class="send" onclick="sendMessage()">↑</button></div></div></div>
 </main>
</div>

<script>
const $=id=>document.getElementById(id);
let csrf="",me=null,chats=[],current=null,uploaded=[],stream=null,generating=false,authRegister=false;

async function api(path,opt={}){
  opt.credentials="same-origin"; opt.headers=opt.headers||{};
  if(opt.body && !(opt.body instanceof FormData)) opt.headers["Content-Type"]="application/json";
  if(!["GET","HEAD"].includes((opt.method||"GET").toUpperCase()) && csrf) opt.headers["X-CSRF-Token"]=csrf;
  const r=await fetch(path,opt); const data=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(data.detail||"Ошибка запроса");e.status=r.status;throw e} return data;
}
async function init(){
  try{csrf=(await api("/api/auth/csrf")).csrf_token;me=await api("/api/auth/me");showApp();await loadChats();}
  catch(e){$("auth").classList.remove("hidden")}
}
function showApp(){ $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("userName").textContent=me.name;$("userEmail").textContent=me.email;$("avatar").textContent=(me.name||"?").slice(0,1).toUpperCase() }
function setAuthMode(reg){
 authRegister=reg;$("authTitle").textContent=reg?"Создать аккаунт":"Войти в Chat Studio";$("authHint").textContent=reg?"Создайте аккаунт для приватных чатов.":"Ваши чаты доступны только вам.";
 $("nameField").classList.toggle("hidden",!reg);$("confirmField").classList.toggle("hidden",!reg);$("authSubmit").textContent=reg?"Создать аккаунт":"Войти";$("switchText").textContent=reg?"Уже есть аккаунт?":"Нет аккаунта?";$("switchMode").textContent=reg?"Войти":"Зарегистрироваться";$("authError").classList.add("hidden")
}
$("switchMode").onclick=()=>setAuthMode(!authRegister);
$("authSubmit").onclick=async()=>{
 try{
  const body=authRegister?{name:$("name").value,email:$("email").value,password:$("password").value,password_confirm:$("confirm").value}:{email:$("email").value,password:$("password").value};
  me=await api(authRegister?"/api/auth/register":"/api/auth/login",{method:"POST",body:JSON.stringify(body)});showApp();await loadChats();
 }catch(e){$("authError").textContent=e.message;$("authError").classList.remove("hidden")}
};
async function logout(){try{await api("/api/auth/logout",{method:"POST"})}finally{location.reload()}}
async function loadChats(){
 chats=await api("/api/chats");renderChats();
 if(!current && chats.length) await openChat(chats[0].id); else if(!current) await newChat();
}
function renderChats(list=chats){
 $("chatList").innerHTML=list.map(c=>`<div class="chat ${current&&current.id===c.id?"active":""}" onclick="openChat('${c.id}')"><span>${esc(c.title)}</span></div>`).join("")||'<div style="padding:12px;color:var(--muted);font-size:13px">Нет чатов</div>';
}
$("search").oninput=async e=>{
 const q=e.target.value.trim();if(!q)return renderChats();
 try{const x=await api("/api/chats/search?q="+encodeURIComponent(q));renderChats(x.map(v=>v.chat))}catch{}
};
async function newChat(){
 const c=await api("/api/chats",{method:"POST",body:JSON.stringify({title:"Новый чат"})});chats.unshift(c);current=c;renderChats();await renderMessages([]);$("chatTitle").textContent=c.title;
}
async function openChat(id){
 current=chats.find(x=>x.id===id)||await api("/api/chats/"+id);$("chatTitle").textContent=current.title;renderChats();
 const ms=await api("/api/messages?chat_id="+encodeURIComponent(id));renderMessages(ms);
}
async function renderMessages(ms){
 if(!ms.length){$("thread").innerHTML='<div class="empty"><div class="welcome"><h1>Чем займёмся?</h1><p>Задайте вопрос, приложите файлы и получите ответ.</p></div></div>';return}
 $("thread").innerHTML='<div class="messages">'+ms.map(messageHTML).join("")+'</div>';scrollBottom()
}
function messageHTML(m){
 const files=(m.files||[]).map(f=>`<span class="filechip">📎 ${esc(f.original_name)}</span>`).join("");
 const meta=m.role==="assistant"&&m.model?`<div class="meta">${esc(m.provider||"AI")} · ${esc(m.model)}</div>`:"";
 return `<article class="msg ${m.role}"><div class="bubble">${meta}${esc(m.content||"")}${files?'<div class="files">'+files+"</div>":""}</div></article>`;
}
async function sendMessage(){
 if(generating)return stopGeneration();
 const content=$("prompt").value.trim(); if(!content)return;
 try{
  let ids=uploaded.map(x=>x.id); $("send").disabled=true;
  const res=await api("/api/messages?chat_id="+encodeURIComponent(current.id),{method:"POST",body:JSON.stringify({content,file_ids:ids})});
  $("prompt").value="";uploaded=[];renderAttachments();generating=true;$("send").textContent="■";
  const ms=await api("/api/messages?chat_id="+encodeURIComponent(current.id));renderMessages(ms);
  await streamRequest(res.ai_request.id);
 }catch(e){alert(e.message)}finally{if(!stream){generating=false;$("send").textContent="↑";$("send").disabled=false}}
}
async function streamRequest(id){
 if(stream)stream.close(); stream=new EventSource("/api/requests/"+id+"/stream");
 stream.addEventListener("delta",e=>{appendDelta(JSON.parse(e.data).text)});
 stream.addEventListener("replace",e=>{replaceLast(JSON.parse(e.data).text)});
 const done=()=>{if(stream){stream.close();stream=null}generating=false;$("send").textContent="↑";$("send").disabled=false;loadChats()};
 ["completed","failed","cancelled","done","error"].forEach(x=>stream.addEventListener(x,done));
 stream.onerror=()=>{if(stream&&stream.readyState===EventSource.CLOSED)done()};
}
function appendDelta(t){
 let box=$("thread").querySelector(".messages");if(!box){$("thread").innerHTML='<div class="messages"></div>';box=$("thread").querySelector(".messages")}
 let last=box.lastElementChild;
 if(!last||!last.classList.contains("assistant")){last=document.createElement("article");last.className="msg assistant";last.innerHTML='<div class="bubble"></div>';box.appendChild(last)}
 last.querySelector(".bubble").textContent+=(t||"");scrollBottom();
}
function replaceLast(t){const last=$("thread").querySelector(".msg.assistant:last-child .bubble");if(last)last.textContent=t||""}
async function stopGeneration(){
 if(!stream)return;const id=current&&null;
 const ms=await api("/api/messages?chat_id="+encodeURIComponent(current.id));const active=ms.find(m=>m.role==="assistant"&&false);
 // request id is retained by the stream URL in this small client
 const url=stream.url;const match=url.match(/requests\/([^/]+)\/stream/);
 if(match)try{await api("/api/requests/"+match[1]+"/cancel",{method:"POST"})}catch{}
}
$("fileInput").onchange=async e=>{
 const fs=[...e.target.files];if(!fs.length)return;
 try{
  const fd=new FormData();fs.forEach(f=>fd.append("files",f));const res=await api("/api/files",{method:"POST",body:fd});uploaded.push(...res.files);renderAttachments();if(res.warnings?.length)alert(res.warnings.join("\n"));
 }catch(err){alert(err.message)}e.target.value=""
};
function renderAttachments(){$("attachments").innerHTML=uploaded.map((f,i)=>`<span class="filechip">📎 ${esc(f.original_name)} <button onclick="uploaded.splice(${i},1);renderAttachments()">×</button></span>` ).join("");$("pending").textContent=uploaded.length?uploaded.length+" файл(ов)":" "}
$("prompt").addEventListener("input",()=>{const x=$("prompt");x.style.height="auto";x.style.height=Math.min(x.scrollHeight,220)+"px"});
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
async function deleteChat(){if(!current||!confirm("Удалить этот чат?"))return;await api("/api/chats/"+current.id,{method:"DELETE"});current=null;chats=chats.filter(c=>c.id!==current?.id);await loadChats()}
async function shareChat(){if(!current)return;try{const s=await api("/api/chats/"+current.id+"/share",{method:"POST"});$("shareUrl").value=location.origin+s.url_path;$("shareModal").classList.remove("hidden")}catch(e){alert(e.message)}}
function closeShare(){$("shareModal").classList.add("hidden")}async function copyShare(){await navigator.clipboard.writeText($("shareUrl").value);closeShare()}
function scrollBottom(){const t=$("thread");requestAnimationFrame(()=>t.scrollTop=t.scrollHeight)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
init();
</script>
</body></html>
